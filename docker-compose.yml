services:
  radio-app:
    build: .
    container_name: on-demand-radio-v2
    ports:
      - "3301:3001"
    volumes:
      - ./data:/data

    restart: always
    environment:
      - NODE_ENV=production
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_ADMIN_EMAILS=${ALLOWED_ADMIN_EMAILS}
      - ALLOWED_VIEWER_EMAILS=${ALLOWED_VIEWER_EMAILS}
      - ALLOWED_TIME_RANGE=${ALLOWED_TIME_RANGE}
      - RESTRICTED_MESSAGE=${RESTRICTED_MESSAGE}

    # /api/health は利用時間制限の対象外なので、営業時間外でも unhealthy にならない
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # ログが無制限に増えてディスクを食い潰さないように上限を付ける
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
